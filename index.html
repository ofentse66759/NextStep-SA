h</span><b>${pc}%</b></div><div class="bar" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div><div style="font-size:.85rem;margin-top:6px">Add proof of work to unlock more matches.</div></div><a class="btn ac" href="#/jobs">See my matches →</a> <a class="btn gh" href="#/learn">Build my skills</a></div>${sb&&!U?'<div class="ban n"><b>Save your progress.</b> <a href="#/account">Create a free account</a> to keep your plans safe and use them on any device.</div>':''}<h2>What's your next step?</h2><div class="g" role="radiogroup">${GL.map((x,i)=>`<button class="goal ${S.goal==i?'on':''}" role="radio" aria-checked="${S.goal==i}" onclick="A.goal(${i})">${x}</button>`).join('')}</div><ol class="g" style="padding:0;list-style:none">${GN[S.goal].map((x,i)=>`<li class="card"><b style="background:var(--a);border-radius:99px;padding:2px 9px">${i+1}</b> ${x}</li>`).join('')}</ol><h2>Deadline radar</h2>${ps.slice(0,2).map(PLAN).join('')}<div class="card" style="border-color:var(--a);background:#FFC24426"><b>No work experience? You have more than you think.</b><br>Turn your spaza, braiding or tutoring hustle into CV skills in 30 seconds. <a href="#/learn">Try it</a></div><div class="ban w"><b>Real employers never ask you to pay.</b> If anyone asks for money, your PIN or an OTP, stop. <a href="#/scam">Check an advert</a></div><h2>Matched for you</h2><div class="g">${OPEN().slice(0,2).map(x=>OPP(x[0],x[1])).join('')}</div><div class="ban n">Install NextStep SA from your browser menu to use saved jobs and lessons when you lose signal.</div>`},

<div class="tl" aria-label="Timeline">

</div>
<div class="mu row" style="justify-content:space-between"><span>Today</span><span>Gaps ${r.gd}d + 1 buffer</span><span>Closing</span></div>
`:'';

orgs(){return`<h1>For organisations</h1><p class="ban w">Prototype with sample data. Only consented, anonymised data is shared.</p><div class="card"><h3>The problem</h3><p>Stats SA reports that youth unemployment (ages 15 to 34) was 47.4% in the second quarter of 2026, with about 5.0 million young people unemployed. In the first quarter, 45.6% of 15 to 34 year olds were not in employment, education or training.</p><p class="mu">Sources: Stats SA Quarterly Labour Force Survey Q1 and Q2 2026 (Q2 released 11 August 2026). Check for a newer release before presenting.</p></div><div class="card"><h3>Top group gaps (TVET college)</h3>${[['Certified ID copy',42],['Proof of residence',38],['CV',31],['Motivation letter',27]].map(g=>`<div>${g[0]} <b>${g[1]}%</b><div class="bar" style="background:var(--m)"><i style="width:${g[1]}%;background:var(--p)"></i></div></div>`).join('')}</div><div class="card"><b>Helper mode:</b> staff help many youths on one shared device, clearing each session. <b>Employer portal:</b> post verified listings, see ready candidates (with consent).</div><div class="card"><h3>Business model (hypotheses to test in pilots)</h3><p>Free for youth, always.</p><ul><li><b>Employers and providers:</b> pay for verified listings and ready, consented candidates.</li><li><b>Funders and corporates:</b> pay for outcome dashboards (plans completed, gaps closed, applications submitted).</li><li><b>Colleges, youth centres, municipalities:</b> pay for helper mode and group reports.</li></ul><p class="mu">Prices are not set yet. Pilot idea: one youth centre, about 30 users, 6 weeks, measuring applications submitted.</p></div>`},
